# Ручной состав страниц фронта. Подключается ключом `web.pages` в docpipe.yaml
# либо флагом `--pages` у `docpipe web scan`.
#
# Зачем он есть. Обход находит страницы по таблице роутов, но таблица знает
# не всё: экран, маршрут которого собирается в рантайме, в неё не попадает,
# а layout с <router-outlet> попадает и экраном не является. Состав
# документации — решение человека, и вот место, где оно записывается.
#
# Как это устроено. Добавленная страница — это запись маршрута из другого
# источника, а не второй механизм: дальше работает всё существующее, включая
# якорь бизнес-документа. Снятие не удаляет узел, а отменяет вид: класс
# остаётся компонентом и документируется как компонент.
#
# Порядок применения фиксирован: автоматика -> add -> remove. Снятие сильнее
# добавления, потому что это последнее слово человека.
#
# ВАЖНО. `reason` обязателен у каждого правила: «сняли 12 страниц» без причин
# — снова безымянное число. А правило, переставшее совпадать (компонент
# переименовали, маршрут стал находиться сам), печатается как находка
# и роняет прогон с `--fail-on-stale-overrides`: иначе страница тихо исчезает
# из документации, и в отчёте просто на строку меньше.

version: "1"

pages:
  add:
    # Ключ `component` — FQN узла: путь файла без расширения плюс имя класса.
    # Он ломается при переносе файла, и это осознанная цена: другого
    # стабильного способа указать на класс у инструмента нет.
    - route: "/forecast/{}/structuring/print"
      component: "src/app/structuring/print/print.component.PrintPage"
      reason: "Экран открывается из окна печати; маршрут задаётся в рантайме"

    - route: "/models/list"
      component: "src/app/models/view/view.component.ViewComponent"
      reason: "Страница платформы: данные приходят из грида, маршрут не объявлен"

  remove:
    # Снятие по маршруту. Если компонент стои́т ещё на других маршрутах,
    # прогон отказывает и называет их: снятие целиком должно быть намеренным.
    - route: "/"
      reason: "Layout с router-outlet, собственного экрана нет"

    # Снятие по компоненту — когда маршрутов несколько или маршрут пустой.
    - component: "src/app/legacy/legacy.module.LegacyBannerComponent"
      reason: "Баннер в шапке; экраном не является"
