# Владение: какой команде принадлежит документ.
#
# Считается на шаге 2, а не в манифесте. Состав команд меняется чаще кода;
# попав в `doc-tree.json`, владение сделало бы манифест зависящим от орг-структуры
# и сломало бы свойство «манифест — чистая функция кода и правил классификации».
#
# Владелец определяется по УЗЛУ, а не по модулю. Соблазн «команда = проект»
# разбивается о шэренный .csproj — ровно ту ситуацию, ради которой владение
# и заводится.
#
# Синтаксис условий тот же, что у rules/dotnet.yaml: один движок, одна
# диагностика опечаток. Правила ТОЛЬКО положительные: более специфичное
# выражается более высоким приоритетом, а не исключением из общего. Отрицаний
# нет намеренно — они превращают набор в систему уравнений, которую нельзя
# прочитать построчно.

version: "1"
ownership_version: "2026-07-30.1"

teams:
  - id: pricing
    title: Ценообразование
  - id: risk
    title: Рыночные риски
  - id: platform
    title: Платформа

rules:
  # ------------------------------------------------------------------------------------
  # 10 — проект целиком
  # ------------------------------------------------------------------------------------
  # Слои идут с шагом приоритета: 10 — проект, 50 — каталог, 80 — namespace,
  # 100 — точечно. Промежутки оставлены намеренно, чтобы вставка нового уровня
  # не требовала перенумерации всего набора.
  - id: pricing.modules
    team: pricing
    priority: 10
    when:
      module_glob: ["src/Cf.Pricing.*/**", "src/Cf.Curves.*/**"]

  - id: risk.modules
    team: risk
    priority: 10
    when:
      module_glob: ["src/Cf.Risk.*/**"]

  - id: platform.modules
    team: platform
    priority: 10
    when:
      module_glob: ["src/Cf.Shared/**", "src/Cf.Infrastructure.*/**"]

  # ------------------------------------------------------------------------------------
  # 50 — шэренный проект режется по каталогам с КОДОМ
  # ------------------------------------------------------------------------------------
  # Ради этого слоя всё и заводится: `path_glob` — единственный способ разделить
  # проект, в котором лежит код нескольких команд.
  #
  # Условие истинно, если совпал ХОТЯ БЫ ОДИН источник. У partial-класса файлы
  # бывают в каталогах разных команд; правило «все источники» оставило бы такой
  # тип ничьим, и это выглядело бы как дефект инструмента. Такие типы попадают
  # в предупреждения `docs owners --lint`.
  - id: pricing.shared-folders
    team: pricing
    priority: 50
    when:
      path_glob: ["src/Cf.Shared/Pricing/**", "src/Cf.Shared/Curves/**"]

  - id: risk.shared-folders
    team: risk
    priority: 50
    when:
      path_glob: ["src/Cf.Shared/Risk/**"]

  # ------------------------------------------------------------------------------------
  # 80 — namespace внутри чужого каталога
  # ------------------------------------------------------------------------------------
  - id: platform.shared-serialization
    team: platform
    priority: 80
    when:
      all:
        - path_glob: ["src/Cf.Shared/**"]
        - namespace_prefix: ["Cf.Shared.Pricing.Serialization"]

  # ------------------------------------------------------------------------------------
  # 100 — точечная передача одного типа
  # ------------------------------------------------------------------------------------
  # Самый неустойчивый слой: `fqn_prefix` ломается от переименования типа.
  # Держать его коротким — признак здорового набора.
  - id: risk.stress-engine
    team: risk
    priority: 100
    when:
      fqn_prefix: ["Cf.Pricing.Engine.StressTestRunner"]

# Восемь предикатов, намеренно мало — та же причина, что в правилах
# классификации: большой набор означает, что настройщик каждый раз выбирает
# из десяти способов написать одно и то же.
#
#   path_glob         пути источников, любой из них    главный инструмент
#   module            имя модуля                       короткая запись
#   module_glob       путь .csproj                     имена проектов не уникальны
#   domain            домен из docpipe.yaml
#   kind              вид сущности
#   namespace_prefix  начало namespace
#   namespace_regex   namespace целиком, re.fullmatch
#   fqn_prefix        начало FQN                       точечно
