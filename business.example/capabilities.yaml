# Дерево бизнес-возможностей.
#
# Одним файлом, а не документом на возможность: дерево маленькое и меняется
# раз в год, а десяток файлов по три строки создаёт работу без содержания.
#
# Идентификатор возможности — `cap.<домен>[.<под>]`, строчными латинскими.
# В нём нет ни команды, ни системы, ни технологии: команды меняются, системы
# переименовывают. Идентификатор отражает, ЧТО делается.

version: "1"

capabilities:
  - id: cap.valuation
    title: Оценка и переоценка

  - id: cap.valuation.eod
    title: Закрытие дня
    parent: cap.valuation

  - id: cap.limits
    title: Лимиты
