# Нормализованный реестр архитектурных элементов (R03).
#
# Контракт между разведкой и графом: слева от него догадки, ручная работа
# и подсказки модели, справа — детерминированная сборка. Всё, что попало сюда,
# человек прочитал и закоммитил; всё, что не попало, в граф не входит.
#
# ЧТО СЮДА ПИШУТ. Только то, чего в коде нет структурно: точки входа,
# объявленные данными, а не кодом; таблицы, известные по декларации; швы между
# языками; роли модулей. Контроллер, который и так виден в коде, сюда писать
# не надо — его найдёт разбор.
#
# КАК ЗАПОЛНЯТЬ. Прогнать разведку (`python3 tools/recon.py --root . --json
# recon.json`), прочитать блоки 4 и 5 — «чем система заякорена» и «как языки
# говорят между собой» — и перенести подтверждённое сюда. Скилл разведки (R02)
# готовит черновик; человек переносит записи в этот файл и меняет провенанс
# на `skill_confirmed`. Черновик со `skill_proposed` этот файл не принимает,
# и это не придирка: предложение модели становится входом графа, только пройдя
# через человека, а «пройдя» обязано быть видно в данных, а не в памяти.
#
# Проверить: docpipe arch validate arch-registry.yaml
# Не отстал ли: docpipe arch status arch-registry.yaml --root .
#
# Примеры ниже сняты с открытого репозитория Wexflow (движок workflow на .NET
# с клиентами на десяти языках) — намеренно: формат не должен быть удобен
# ровно одному репозиторию, и проверяется это тем, что его заполняют на чужом.

version: "1"

records:
  # ────────────────────────────────────────────────────────────────────────────
  # Точки входа: то, что запускают. Корни графа.
  # ────────────────────────────────────────────────────────────────────────────

  # Ключ — то, что обязан знать вызывающий. Здесь это имя задачи из XML:
  # универсальный движок читает `<Task name="…">` и создаёт по нему класс.
  # Литерала конкретной задачи в C# не существует — связь делает реестр.
  - kind: entry_point
    key: ApproveRecord
    entry_kind: workflow
    name: Утверждение записи
    # Подсказка на код, а не ссылка: связь «запись → узел кода» делает граф,
    # и её отсутствие не дефект. Корень существует и без найденного класса.
    impl: Wexflow.Tasks.ApproveRecord.ApproveRecord
    source:
      file: samples/net/Wexflow/Workflows/Workflow_ApproveInvoice.xml
      record: Workflow/Tasks/Task[@name='ApproveRecord']
      # Хэш источника на момент снимка. Без него устаревание записи не ловится
      # ничем: `docpipe arch status` напечатает `no_hash` и подскажет строку.
      hash: ""
    provenance: manual

  # HTTP-эндпоинт: ключ собирается из метода и маршрута, а не из имени класса.
  # Переименование контроллера ключ не меняет — в этом и смысл якоря.
  - kind: entry_point
    key: POST api/v1/workflows/start
    entry_kind: http_endpoint
    http_method: POST
    route: /api/v1/workflows/{id}/start
    name: Запуск workflow из клиента
    source:
      file: src/net/Wexflow.Server/WexflowService.cs
      record: StartWorkflow
    provenance: manual

  # ────────────────────────────────────────────────────────────────────────────
  # Данные: то, что трогают. Имя логическое, а не строка подключения.
  # ────────────────────────────────────────────────────────────────────────────

  - kind: data
    key: workflows
    data_kind: table
    name: Определения workflow
    # Таблица-носитель, когда ключ — логическое имя, а не имя таблицы.
    table: wexflow.workflows
    fields:
      - name: Id
        kind: FieldNumber
        display_name: Идентификатор
      - name: Xml
        kind: FieldText
        display_name: Определение
    # Связи сущностей читаются ИЗ ДЕКЛАРАЦИИ, а не выводятся из графа кода.
    references: ["wexflow.records"]
    source:
      file: src/net/Wexflow.Core.Db.LiteDB/Db.cs
      record: WorkflowCollectionName
    provenance: manual

  # ────────────────────────────────────────────────────────────────────────────
  # Швы: строка, которую обязаны знать обе стороны. Между языками вызовов нет.
  # ────────────────────────────────────────────────────────────────────────────

  # Разведка нашла этот литерал в файлах десяти языков сразу — клиенты
  # Wexflow написаны на C++, Go, Java, PHP, Python, Ruby, Rust и других,
  # и все они знают один и тот же базовый адрес.
  - kind: seam
    key: api/v1
    seam_kind: http_route
    literal: http://localhost:8000/api/v1
    name: Базовый адрес REST-API движка
    sides: ["csharp", "java", "python", "go", "php"]
    source:
      file: samples/clients/client/client.py
      record: "uri = ..."
    provenance: manual

  # ────────────────────────────────────────────────────────────────────────────
  # Слои: из чего репозиторий состоит и что чем является.
  # ────────────────────────────────────────────────────────────────────────────

  - kind: layer
    key: src/net/Wexflow.Core
    role: library
    name: Ядро движка
    path: src/net/Wexflow.Core
    language: csharp
    source:
      file: src/net/Wexflow.Core/Wexflow.Core.csproj
    provenance: manual

  - kind: layer
    key: samples/clients
    role: tests
    name: Клиенты-примеры на десяти языках
    path: samples/clients
    source:
      file: samples/clients
    provenance: manual
