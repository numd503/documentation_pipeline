# Ручной состав страниц фронта.
#
# Обход находит страницы по таблице роутов, но таблица знает не всё, а состав
# документации — решение человека. Здесь оно и записывается. Ключи —
# docs/setup-map.md клона docpipe, раздел «`pages.yaml`»; формы записей —
# docs/pages.md.
#
# Порядок применения: автоматика -> add -> remove. Снятие сильнее добавления.
# `reason` обязателен у каждого правила. Правило, переставшее совпадать,
# печатается как находка и роняет прогон с --fail-on-stale-overrides.

version: "1"

pages:
  # add:
  #   - route: "/reports/print"
  #     component: "<путь к файлу без .ts>.PrintPage"
  #     reason: "Экран открывается из окна печати; маршрут задаётся в рантайме"
  add: []

  # remove:
  #   - route: "/"
  #     reason: "Layout с router-outlet, собственного экрана нет"
  remove: []

# Разделы: единицы документации без маршрута. Кандидатов называет
# `docpipe setup candidates features`.
features: []
  # - name: "reports"
  #   path: "<путь к каталогу раздела от --root>"
  #   title: "Отчёты"
  #   reason: "Открывается из меню с любого экрана, собственного URL нет"
