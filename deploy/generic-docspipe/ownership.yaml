# Владение: какой команде принадлежит документ.
#
# Заготовка: команд нет, правил нет. В таком виде файл работает — у всех
# документов `team: null`, — но ничего не раздаёт. Заполняется, когда
# становится понятно, кто за что отвечает; ключи и что ломается молча —
# docs/setup-map.md клона docpipe, раздел «`ownership.yaml`».
#
# Пустой файл лучше выдуманного: правило с несуществующим `module_glob`
# молча не срабатывает, и «ничьих узлов много» уже не отличить от «правило
# написано с опечаткой».
#
# Владелец определяется по УЗЛУ, а не по модулю: в общем `.csproj` бывает код
# нескольких команд. Правила только положительные — более специфичное
# выражается более высоким приоритетом, а не исключением из общего.

version: "1"
ownership_version: "1"

# Команда, которой нет здесь, не может быть названа в правиле — и `--team`
# с неизвестным именем тоже отказ, а не пустая выборка.
teams: []
  # - id: backend
  #   title: Бэкенд

# Порядок работы: один слой приоритета 10 по `module_glob`, затем
# `docpipe docs owners МАНИФЕСТ --config <этот каталог>/docpipe.yaml --lint` —
# сколько узлов осталось ничьими и где. Слои 50 и выше — только там, где линт
# покажет реальное смешение.
rules: []
  # - id: backend.modules
  #   team: backend
  #   priority: 10
  #   when:
  #     module_glob: ["src/**"]
