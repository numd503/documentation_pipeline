# Нормализованный реестр архитектурных элементов (R03).
#
# ПРИЕЗЖАЕТ ПУСТЫМ, И ЭТО РАБОЧЕЕ СОСТОЯНИЕ. Сборка графа берёт корни из кода
# и печатает «декларативных источников точек входа нет». Заполнять реестр
# догадками нельзя: неверная запись выходит уверенным неправильным ребром
# в ответе на вопрос, и отличить её от факта уже нельзя.
#
# Сюда пишут только то, чего в коде нет структурно: точки входа, объявленные
# данными, таблицы, известные по декларации, швы между языками, роли модулей.
# Контроллер, который виден в коде, найдёт разбор.
#
# Как заполнять: `docpipe recon --root .`, затем скилл `recon` готовит черновик
# `arch-registry.draft.yaml`; записи переносит человек, меняя провенанс
# на `skill_confirmed`. Черновик со `skill_proposed` этот файл не принимает.
# Ключи — docs/setup-map.md клона docpipe, раздел «`arch-registry.yaml`»;
# формат — docs/arch-registry.md.
#
# Проверить:      docpipe arch validate <этот файл>
# Не отстал ли:   docpipe arch status  <этот файл> --root .
# Что видит граф: docpipe arch records --root .

version: "1"

records: []
