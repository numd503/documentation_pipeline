# Конфигурация docpipe: нейтральный набор.
#
# Положил его `install.sh` из клона docpipe. Инструмента в репозитории нет:
# он стоит на машине (`uv tool install`), а здесь живёт только настройка.
# Настройку ведёт скилл `setup` агента — он читает код, пишет правила сюда
# и в файлы рядом и перезапускает проверки; решения остаются за человеком.
#
# Каждый ключ ниже записан — значением или комментарием. Ключ, закомментированный
# одной строкой, — умолчание: значение в комментарии и возьмёт инструмент
# (кроме `registries`: умолчания у него нет, строка — образец, см. ниже).
# Закомментированный блок — образец записи. Что ключ делает, кто его читает,
# от чего отсчитывается путь и что ломается молча — в карте настройки,
# `docs/setup-map.md` клона docpipe; заголовок каждой группы называет её раздел.
#
# Два вида путей, и путать их нельзя:
#
#   ВХОДЫ (rules, templates, ownership, registries, pages, arch) записаны
#   КОРОТКИМИ именами — относительно ЭТОГО каталога. Их разрешает вторая
#   ступень: текущий каталог, затем каталог `docpipe.yaml`. Поэтому каталог
#   настройки можно перенести, не правя ни строки здесь.
#
#   ЦЕЛИ ЗАПИСИ (out, worklist, web.out, web.link_out, graph.out) и пути
#   от --root (cache_dir, business_root, docs_scan_exclude) второй ступени
#   НЕ получают: угадывать, куда писать, инструмент не должен. Их подставил
#   установщик, и они отсчитываются от КОРНЯ РЕПОЗИТОРИЯ.
#
# Поэтому команды зовут из корня репозитория, и первая из них — проверка:
#
#     docpipe config check --config "@CONFIG_DIR@/docpipe.yaml" --root .

# ==========================================================================
# Обход и область (шаг 1) — docs/setup-map.md, «Обход и область (шаг 1)»
# ==========================================================================

# Каталоги, в которых искать исходники .NET, относительно `--root`. Сужают
# обход, а не состав документации. Полный список проектов даёт `docpipe recon`.
roots:
  - "."

# Что документируем: глоб по пути `.csproj`, запись — строка или объект
# с причиной. Без ключа документируется всё, но это умолчание, а не решение:
# область задаёт человек.
# enrolled:
#   - glob: "src/**"
#     reason: "продуктовый код"

# Что решили НЕ документировать — причина обязательна. Модуль, совпавший
# с явным `enrolled` и с `not_enrolled` сразу, — отказ прогона.
# not_enrolled:
#   - glob: "samples/**"
#     reason: "примеры, не продукт"

# Куда не заходить вовсе: файл не читается и символов не даёт. Складывается
# со встроенным списком (`**/obj/**`, `**/bin/**`, `**/node_modules/**` и др.).
# Шаблон обязан кончаться на `/**`, иначе совпадёт только сам каталог.
# exclude: []

# Смысловая группировка модулей: глоб `.csproj` -> домен. Без совпадения
# доменом становится имя модуля.
# domains: {}

# Самодельные обёртки регистрации в контейнере. Кандидатов называет
# `docpipe setup candidates di-methods`.
# di_methods: []

# Интерфейсы диспетчеризации по типу запроса. Кандидатов называет
# `docpipe setup candidates dispatch-interfaces`.
# dispatch_interfaces: []

# ==========================================================================
# Правила и артефакты шага 1 — docs/setup-map.md, «Правила и артефакты шага 1»
# ==========================================================================

# Файл правил классификации, секции `dotnet:` и `web:`. Флаг `--config`
# обязателен: без него `rules` по умолчанию — `rules/rules.yaml` от текущего
# каталога, и прогон молча возьмёт не тот набор.
rules: "rules.yaml"

# Манифест и сидкар `doc-tree.run.json` рядом с ним.
out: "@CONFIG_DIR@/artifacts/doc-tree.json"

# Кэш разобранных файлов — вне репозитория. Подставил установщик (--cache-dir).
cache_dir: "@CACHE_DIR@/parse"

# ==========================================================================
# Шаг 2 и очередь — docs/setup-map.md, «Шаг 2 и очередь»
# ==========================================================================

# Скелеты документов, по одному на значение `template` из rules.yaml.
templates: "templates"

# Корень дерева документации, от `--root`.
# docs_root: "docs"

# Каталог технической документации внутри `docs_root` и раскладка в нём.
# Все три ключа замерзают в манифесте: сменили — пересоберите его полным `scan`.
# modules_dir: "modules"
# doc_layout: "kind-first"

# Куда не заходить при поиске документов. Каталог настройки исключается
# обязательно: в `templates/examples/` лежат образцы с настоящим front matter.
docs_scan_exclude:
  - "@CONFIG_DIR@/**"

# Очередь для шага 3.
worklist: "@CONFIG_DIR@/artifacts/doc-worklist.json"

# Правила владения документами. Файл приезжает заготовкой: команд и правил нет.
ownership: "ownership.yaml"

# ==========================================================================
# Бизнес-слой — docs/setup-map.md, «Бизнес-слой»
# ==========================================================================

# Описание реестров, где объявлены точки входа (джобы, workflow, обработчики
# событий). Заготовка `registries.yaml` лежит рядом, но ключ закомментирован:
# пустое описание загрузчик отвергает. Сначала опишите реестр там, потом
# раскомментируйте ключ.
# registries: "registries.yaml"

# Каталог бизнес-документов, от `--root`.
business_root: "@CONFIG_DIR@/business"

# ==========================================================================
# Секция `web` — docs/setup-map.md, «Секция `web`»
# ==========================================================================
web:
  # Где искать фронты, от `--root`. При нескольких фронтах `.` обходит все;
  # полный список даёт `docpipe recon`.
  # roots:
  #   - "."

  # Тот же файл правил — секция `web` внутри него.
  rules: "rules.yaml"

  # Ручной состав страниц. Пустой файл — законное состояние.
  pages: "pages.yaml"

  # Ветка фронта внутри `docs_root`. Пусто — та же, что `modules_dir`.
  # modules_dir: ""

  # Манифест фронта и отчёт связи фронт <-> бэк.
  out: "@CONFIG_DIR@/artifacts/doc-tree.web.json"
  link_out: "@CONFIG_DIR@/artifacts/web-link.json"

  # Что прокси модуля делает с URL по дороге к бэкенду. Отсутствие записи
  # о модуле — не «преобразования нет», а ненастроенный модуль.
  # url_rewrite: []

  # Маршруты, смысл которых задаёт значение параметра, а не маршрут.
  # Кандидатов называет `docpipe setup candidates registry-calls`.
  # registry_calls: []

  # Обёртки над HttpClient и построители адреса: вызов через них виден
  # только после записи. Кандидатов называют `docpipe setup candidates
  # http-wrappers` и `url-builders`; распознавать обёртку по имени нельзя.
  # http_wrappers: []   # {receiver: rest, method: request, url: {arg: 0, field: url}, http_method: {arg: 0, field: method}}
  # url_builders: []    # {receiver: apiUrl, method: buildUrl, path: {arg: 0}}

# ==========================================================================
# Реестр графа — docs/setup-map.md, «Реестр графа: `arch` и адаптеры»
# ==========================================================================

# Нормализованный реестр архитектурных элементов. Приезжает пустым, и это
# рабочее состояние; заполняется разведкой через человека.
arch: "arch-registry.yaml"

# Адаптеры читают исходные реестры при каждой сборке.
# arch_adapters: []

# ==========================================================================
# Секция `graph` — docs/setup-map.md, «Секция `graph`»
# ==========================================================================
graph:
  # Путь к движку разбора (codebase-memory-mcp 0.6.0). Умолчания нет
  # намеренно; пусто — `graph *` откажут. Подставил установщик (--engine).
  engine_path: "@ENGINE@"

  # Пусто — закреплённая в мосте сумма; расхождение — предупреждение.
  # engine_sha256: ""

  # fast / moderate / full.
  # mode: "fast"

  # Индекс графа — цель записи, как `out`.
  out: "@CONFIG_DIR@/artifacts/graph.db"

  # Кэш движка — вне репозитория и свой у каждого репозитория: мост удаляет
  # каталог целиком перед каждой сборкой. Подставил установщик (--cache-dir).
  cache_dir: "@CACHE_DIR@/engine"

# ==========================================================================
# Секция `link` — docs/setup-map.md, «Секция `link`»
# ==========================================================================
# Решения о концах шва фронт↔.NET, у которых пары в репозитории нет и не будет:
# вызов во внешний адрес, эндпоинт, который зовут извне, вызов, адрес которого
# статически не восстановить. Причина у каждой записи обязательна — это решение
# «документируем или нет», и называет его человек. Приезжает пустой.
# link:
#   external_targets: []    # {host: "*.example.org", reason: "…", document: false}
#   external_callers: []    # {route: "content/**", reason: "…", document: true}
#   unresolvable: []        # {path: "src/app/**/links.service.ts", reason: "…"}
