# Реестры, которые УЖЕ объявляют точки входа: файлы конфигурации, где джобы,
# workflow, сервисы и обработчики событий названы данными, а не кодом.
#
# ЗАГОТОВКА. Реестров в ней нет, поэтому в `docpipe.yaml` ключ `registries`
# закомментирован: описание без единого реестра загрузчик отвергает
# («`registries` должен быть непустым списком»). Порядок: описать первый
# реестр ниже, проверить, что он читается, и только потом раскомментировать
# ключ. Где искать реестры, подсказывает `docpipe recon` (блок «чем система
# заякорена»).
#
# Пути внутри файла — от корня репозитория. Нечитаемый файл прогон не роняет:
# строка в отчёте, остальное читается, — поэтому неверный путь выглядит как
# «точек входа 0», а не как ошибка. Проверять его надо глазами.
#
# Ключи и что ломается молча —
# docs/setup-map.md клона docpipe, раздел «`registries.yaml`»;
# полный образец — registries.example.yaml там же.

version: "1"
registries_version: "1"

