# Ручной состав страниц фронта АС CF.
#
# Обход находит страницы по таблице роутов, но таблица знает не всё, а состав
# документации — решение человека. Здесь оно и записывается. Полный справочник:
# docs/pages.md, пример со всеми формами: pages.example.yaml.
#
# Порядок применения: автоматика -> add -> remove. Снятие сильнее добавления.
# `reason` обязателен у каждого правила. Правило, переставшее совпадать,
# печатается как находка и роняет прогон с --fail-on-stale-overrides.
#
# Первое, что стоит сюда записать после прогона `docpipe web pages`:
#
#   * layout-обёртки. У ML это `RoutesComponent` на маршруте `/` — ноль членов,
#     ноль вызовов, только <router-outlet>. Отчёт помечает такие заметкой
#     «маршрут пустой» и «признаков функционала не найдено»;
#   * экраны, которых в таблице роутов нет: маршрут собирается в рантайме
#     либо страница открывается из окна печати.
#
# Разведанный кандидат на проверку — `/models/list` (`ViewComponent`, 4 члена,
# ноль зависимостей, ноль вызовов): похоже на страницу платформы, у которой
# данные приходят из грида. Сначала посмотреть глазами, потом решать.

version: "1"

pages:
  # add:
  #   - route: "/forecast/{}/structuring/print"
  #     component: "sbt.cms.cashflow.subrepo/Sbt.CMS.Cashflow.ML/src/app/…/print.component.PrintPage"
  #     reason: "Экран открывается из окна печати; маршрут задаётся в рантайме"
  add: []

  # remove:
  #   - route: "/"
  #     reason: "Layout с router-outlet, собственного экрана нет"
  remove: []
