# Правила классификации: один файл, по секции на шаг.
#
# `dotnet` читают `scan`, `symbols` и `validate`; `web` — `web scan`. Секцию
# называет вызывающий, и умолчания у неё нет: плоский файл, прочитанный шагом
# `web`, дал бы .NET-правила на TypeScript, а `require_public: true` отсеял бы
# весь фронт разом — без единого сообщения об ошибке.

version: "1"

dotnet:
  # Правила классификации типов для АС CF.
  #
  # Отличия от эталонного набора помечены прямо здесь пометкой «АС CF» — сам
  # эталон в поставку не входит, сравнивать его копию было не с чем.
  # Новая версия этого файла приходит при обновлении как `rules.yaml.new`:
  # `diff rules.yaml rules.yaml.new` показывает, что изменилось выше по течению.
  #
  # Порядок настройки: `scan --stats` -> взять самый крупный проект из среза
  # «модули» -> `symbols --module <проект>`, чтобы увидеть сами типы -> дописать
  # одно решение -> повторить. Правило, покрывающее 500 типов, полезнее пяти
  # правил по десять. Команды целиком — в README.md рядом.

  ruleset_version: "2026-07-27.cf.1"

  # Что вообще не документируется. Проверяется до правил.
  #
  # Важно: исключённый тип всё равно РАЗБИРАЕТСЯ, его символ остаётся в индексе
  # и участвует в графе наследования. Продуктовый класс, унаследованный от
  # базового класса из тестового проекта, классификацию не потеряет.
  #
  # ----------------------------------------------------------------------------
  # ФОРМА ЗАПИСИ. Ниже — краткая форма: четыре поля без причин. Она поддерживается
  # и работать не перестанет, но в отчёте `scan --stats` её решения подписаны
  # общими формулировками («Имя типа совпало с шаблоном отсева»).
  #
  # Полная форма — список `rules` с полем `reason` у каждого решения и любым
  # из десяти предикатов в условии, включая `attribute`, `namespace_regex`
  # и `inherits`. Формы складываются: можно дописать `rules:` рядом с полями
  # ниже, ничего в них не меняя. Пример полной формы — заготовки в конце
  # этого же комментария.
  #
  # Зачем это нужно на АС CF: три самые крупные группы неклассифицированного
  # опознаются атрибутом и namespace, а не путём, — то есть в краткой форме
  # их нельзя было ни классифицировать, ни отсеять, и они оставались
  # «неклассифицированными» навсегда. Заготовки ниже; перед включением ПРОВЕРИТЬ
  # на репозитории, что под каждое попадает то, что ожидается:
  #
  #     grep -rl "GenerateCode" --include=*.cs src/ | sed 's|/[^/]*$||' \
  #       | sort | uniq -c | sort -rn | head -20
  #
  #   rules:
  #     - id: generated.schemas
  #       reason: "Сгенерировано по XSD сервисных контрактов: документ был бы
  #                пересказом схемы и переписывался бы при каждой перегенерации"
  #       priority: 100
  #       when:
  #         any:
  #           - attribute: ["GenerateCode"]
  #           - namespace_regex: [".*\\.Services\\.Schemas\\..*"]
  #
  #     # 109 типов. Решение НЕ очевидно: если модель данных в гриде важна как
  #     # документация, это не отсев, а отдельный вид сущности со своим шаблоном.
  #     - id: grid.binary-contracts
  #       reason: "Контракт хранения в кэше GridGain: описывается в модели данных"
  #       priority: 80
  #       when:
  #         inherits: ["Apache.Ignite.Core.Binary.IBinarizable"]
  # ----------------------------------------------------------------------------
  exclude:
    path_glob:
      - "**/obj/**"
      - "**/bin/**"
      - "**/*.g.cs"
      - "**/*.Designer.cs"
      - "**/*.generated.cs"
      - "**/Migrations/**"
      # АС CF: шаблоны сужены. В эталоне здесь `**/*Test/**` и `**/*Tests/**` —
      # они отсекают ЛЮБОЙ каталог, чьё имя оканчивается на Test(s), включая
      # предметный `StressTest/` или `BackTest/`. Для финансового моделирования
      # это прямой риск потерять продуктовый код.
      #
      # Точка перед Test оставляет только каталоги тестовых ПРОЕКТОВ, названных
      # по конвенции .NET (`Cf.Pricing.Tests`), и не трогает предметные.
      #
      # ПРОВЕРИТЬ на репозитории, что ничего не потеряно и ничего не осталось:
      #     find . -type d \( -name '*Test' -o -name '*Tests' \) -not -path '*/obj/*' \
      #       | grep -v '\.Tests\?$'
      # Всё, что выведет команда, — каталоги, которые НЕ попадут под шаблоны ниже.
      # Если среди них есть тестовые, допишите их сюда явно.
      - "**/*.Tests/**"
      - "**/*.Test/**"
      - "**/test/**"
      - "**/tests/**"
      - "**/TestUtils/**"
    name_regex:
      - "^.*Dto$"
      - "^.*Request$"
      - "^.*Response$"
      - "^.*Options$"
      - "^.*Settings$"
      # АС CF: правило оставлено. Диагностика показала около тридцати классов
      # `*Test`/`*Tests`, и все они — настоящие тесты.
      #
      # Регулярное выражение заякорено с обеих сторон, поэтому `StressTestRun`
      # под него НЕ подпадает: «Test» в середине имени безопасен. Опасно было бы
      # ровно обратное — предметная сущность, названная `StressTest` без суффикса.
      # Если такая появится, правило придётся убрать и положиться на path_glob.
      - "^.*Tests?$"
    type_kind_deny: ["enum"]
    # Главный рычаг объёма. `true` — документируется только публичная поверхность.
    # На библиотечном коде это убирает половину типов; на прикладном меньше.
    # Если внутренняя кухня АС CF тоже нужна в документации — поставить false
    # и посмотреть на прирост в `scan --stats`.
    require_public: true

  rules:
    - id: controller.aspnet
      kind: controller
      template: controller
      priority: 100
      when:
        any:
          - attribute: ["ApiController"]
          - base_type: ["ControllerBase", "Controller"]
          - inherits: ["ControllerBase", "Controller"]

    # --- Ignite / GridGain --------------------------------------------------
    # ТРЕБУЕТ ПРОВЕРКИ НА РЕПОЗИТОРИИ. Правила написаны по Apache Ignite .NET,
    # а в АС CF используется GridGain — коммерческая сборка, namespace-ы в ней
    # могут отличаться. Что выполнить перед первым прогоном:
    #
    #     grep -rhoE ': *I(Service|ComputeFunc|ComputeJob|ComputeTask)[<,) ]' \
    #       --include=*.cs . | sort | uniq -c | sort -rn
    #     grep -rho 'using [A-Za-z.]*\(Ignite\|GridGain\)[A-Za-z.]*;' --include=*.cs . \
    #       | sort | uniq -c | sort -rn
    #
    # Найденные полные имена дописать в `inherits`. Предикат смотрит на всё
    # замыкание наследования, поэтому сработает и на классе, который наследует
    # ваш собственный `CfComputeBase`, а тот уже реализует `IComputeFunc`.
    - id: ignite.service
      kind: ignite_service
      template: ignite-service
      priority: 95
      when:
        all:
          - type_kind: ["class", "record"]
          # АС CF: голое `IService` убрано намеренно. Имя слишком общее — в ABP,
          # где Ignite нет вовсе, оно поймало посторонний тип со своим одноимённым
          # интерфейсом. Сравниваются и короткое имя, и полное.
          - inherits: ["Apache.Ignite.Core.Services.IService"]

    - id: ignite.compute
      kind: ignite_compute
      template: ignite-compute
      priority: 94
      when:
        all:
          - type_kind: ["class", "record"]
          - inherits: ["IComputeFunc", "IComputeJob", "IComputeTask"]

    # --- Предметные шаблоны из постановки ------------------------------------
    - id: workflow
      kind: workflow
      template: workflow
      priority: 90
      when:
        all:
          - type_kind: ["class", "record"]
          - any:
              - name_suffix: ["Workflow"]
              - inherits: ["IWorkflow"]

    - id: provider
      kind: provider
      template: provider
      priority: 50
      when:
        all:
          - type_kind: ["class", "record"]
          - any:
              - name_suffix: ["Provider"]
              - inherits: ["IProvider"]

    - id: repository
      kind: repository
      template: repository
      priority: 45
      when:
        all:
          - type_kind: ["class", "record"]
          - name_suffix: ["Repository"]

    - id: service
      kind: service
      template: service
      priority: 40
      when:
        all:
          - type_kind: ["class", "record"]
          - name_suffix: ["Service"]

    # --- Заготовки под находки `scan --stats` --------------------------------
    # Раскомментировать и поправить, когда станет видно, что в АС CF реально
    # встречается. Правила по базовому типу должны иметь приоритет ВЫШЕ, чем
    # правила по суффиксу имени: иначе `PricingCalculationService` уйдёт
    # в `service` по имени, хотя он расчётная задача кластера.
    #
    # Регистрация в DI маркерным интерфейсом — это классификация, а не работа
    # для di.py: синтаксически там не вызов `AddScoped`, а наследование.
    # Диагностика нашла в АС CF единственное вхождение `IDependency`,
    # поэтому правило пока выключено.
    #
    # - id: cf.injected-service
    #   kind: service
    #   template: service
    #   priority: 60
    #   when:
    #     all:
    #       - type_kind: ["class"]
    #       - inherits: ["IDependency"]
    #
    # - id: cf.calculation
    #   kind: calculation
    #   template: calculation
    #   priority: 80
    #   when:
    #     all:
    #       - type_kind: ["class", "record"]
    #       - any:
    #           - name_suffix: ["Calculator", "Calculation"]
    #           - inherits: ["ICalculation"]

# --- Фронтенд (Angular) ---------------------------------------------------
# Эталонный набор шага `web`, скопированный без изменений: под АС CF он ещё
# не настраивался. Порядок тот же, что у .NET: `web scan --stats` -> посмотреть
# срез «решение не принято» -> дописать одно правило -> повторить.
web:
  # Правила классификации символов фронтенда (Angular).
  #
  # Тот же движок, что у `rules/dotnet.yaml`, и те же десять предикатов. Матчинг
  # идёт по декоратору (`attribute`), по имени файла и пути (`path_glob`),
  # по имени (`name_suffix`) и по базовому типу (`inherits`).
  #
  # Набор минимальный: он доводится до состояния «`undecided` равно нулю»
  # в задаче F12, где заводятся отсевы с причинами и проверяется атрибуция
  # по приоритету.

  ruleset_version: "2026-08-09.web.1"

  exclude:
    # У TypeScript модификатора `public` на уровне объявления нет вовсе:
    # видимость задаётся словом `export`. Оставленный `true` отсеял бы
    # **все** символы фронта разом, и отчёт показал бы пустое дерево
    # без единого сообщения об ошибке.
    require_public: false

    rules:
      - id: web.spec
        reason: "Тест: обходом не исключается, потому что нужен резолву, но документом не становится"
        priority: 100
        when:
          path_glob:
            - "**/*.spec.ts"
            - "**/*.test.ts"

      - id: web.declaration
        reason: "Файл деклараций: описывает чужой контракт, а не наш код"
        priority: 99
        when:
          path_glob: ["**/*.d.ts"]

      - id: web.mock
        reason: "Мок: существует ради теста, документируется вместе с ним"
        priority: 98
        when:
          path_glob: ["**/*.mock.ts", "**/mocks/**"]

      - id: web.environment
        reason: "Конфигурация сборки: значения различаются между окружениями и меняются вне кода"
        priority: 97
        when:
          path_glob: ["**/environments/**"]

      - id: web.bootstrap
        reason: "Точка входа приложения: состав провайдеров, а не поведение"
        priority: 96
        when:
          path_glob: ["**/main.ts", "**/polyfills.ts"]

      # Константа модуля с URL или значением: документируется вместе с сервисом,
      # который её использует. Отдельный документ на `export const auditUrl`
      # пересказывал бы одну строку.
      #
      # `unless` здесь обязателен, и вот почему: отсев проверяется ДО правил
      # классификации, а функциональный интерцептор, guard и таблица роутов —
      # тоже константы. Без выреза этот отсев съел бы их все разом, и в дереве
      # не осталось бы ни одного интерцептора при том, что в АС CF они объявлены
      # именно так.
      - id: web.module-constant
        reason: "Константа модуля: документируется вместе с сервисом, который её использует"
        priority: 50
        when:
          type_kind: ["const"]
        unless:
          any:
            - name_suffix: ["Interceptor", "Guard", "Resolver"]
            - path_glob: ["**/*.routes.ts", "**/routesPath/**"]

  # Два вида решаются НЕ здесь, и это не пробел набора: `page` и `api-service`
  # зависят от фактов, которых движок правил не видит.
  #
  #   page         компонент, до которого можно дойти по таблице роутов;
  #                таблица собирается межфайлово (F08), символ о ней не знает;
  #   api-service  сервис, который делает HTTP-вызовы; вызовы разбираются
  #                отдельно (F07), и в `Symbol` их тоже нет.
  #
  # Оба повышения делает `web/tree.py` после классификации: правило говорит
  # «это компонент», а таблица роутов — «этот компонент является страницей».
  # Выразить их предикатом по имени или пути можно было бы только угадыванием,
  # а угаданная страница ломает якорь бизнес-документа.
  rules:
    - id: web.component
      kind: component
      template: component
      priority: 100
      when:
        attribute: ["Component"]

    - id: web.state
      kind: state
      template: state
      priority: 99
      when:
        attribute: ["State"]

    - id: web.module
      kind: ng-module
      template: component
      priority: 98
      when:
        attribute: ["NgModule"]

    - id: web.pipe
      kind: pipe
      template: component
      priority: 97
      when:
        attribute: ["Pipe"]

    - id: web.directive
      kind: directive
      template: component
      priority: 96
      when:
        attribute: ["Directive"]

    # Интерцептор проверяется ДО сервиса: у класса-интерцептора есть и `@Injectable`,
    # и `implements HttpInterceptor`, и без приоритета он стал бы обычным сервисом.
    - id: web.interceptor
      kind: interceptor
      template: service
      priority: 95
      when:
        any:
          - inherits: ["HttpInterceptor"]
          - base_type: ["HttpInterceptor"]
          - name_suffix: ["Interceptor"]

    - id: web.guard
      kind: guard
      template: service
      priority: 94
      when:
        name_suffix: ["Guard"]

    - id: web.service
      kind: service
      template: service
      priority: 90
      when:
        all:
          - type_kind: ["class"]
          - any:
              - attribute: ["Injectable"]
              - name_suffix: ["Service"]

    # Экшены NGXS: класс без декоратора, со статическим полем `type`.
    # Единственное стабильное литеральное звено цепочки — строка типа экшена.
    - id: web.action
      kind: action
      template: service
      priority: 80
      when:
        all:
          - type_kind: ["class"]
          - path_glob: ["**/*.actions.ts"]

    - id: web.routes
      kind: routes
      template: service
      priority: 70
      when:
        all:
          - type_kind: ["const"]
          - path_glob: ["**/*.routes.ts", "**/routesPath/**"]

    - id: web.dto
      kind: dto
      template: dto
      priority: 60
      when:
        type_kind: ["interface", "enum"]
