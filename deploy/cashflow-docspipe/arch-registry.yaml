# Нормализованный реестр архитектурных элементов АС CF (R03).
#
# Контракт между разведкой и графом: слева от него догадки, ручная работа
# и подсказки модели, справа — детерминированная сборка. Всё, что попало сюда,
# человек прочитал и закоммитил; всё, что не попало, в граф не входит.
#
# ПРИЕЗЖАЕТ ПУСТЫМ, И ЭТО РАБОЧЕЕ СОСТОЯНИЕ. Пустой реестр валиден: сборка
# графа берёт корни из кода и печатает «декларативных источников точек входа
# нет». Заполнять его догадками из другого репозитория нельзя — неверная
# запись отсюда выходит уверенным неправильным ребром в ответе на вопрос,
# и отличить её от факта, извлечённого из XML, уже нельзя.
#
# ЧТО СЮДА ПИШУТ. Только то, чего в коде нет структурно: точки входа,
# объявленные данными (у АС CF это джобы, workflow и обработчики событий —
# литерала конкретного workflow в C# не существует), таблицы, известные
# по декларации, швы между языками, роли модулей. Контроллер, который и так
# виден в коде, сюда писать не надо: его найдёт разбор.
#
# КАК ЗАПОЛНЯТЬ. Из клона инструмента:
#
#     docpipe recon --root <корень> --json recon.json --text recon.txt
#
# прочитать блоки 4 и 5 — «чем система заякорена» и «как языки говорят между
# собой» — и перенести подтверждённое сюда. Скилл `recon` готовит черновик
# `arch-registry.draft.yaml`; записи переносит человек, меняя провенанс
# на `skill_confirmed`. Черновик со `skill_proposed` этот файл не принимает,
# и это не придирка: предложение модели становится входом детерминированной
# сборки, только пройдя через человека, а «пройдя» обязано быть видно
# в данных, а не в чьей-то памяти.
#
# Образец заполнения — `arch-registry.example.yaml` в репозитории разработки:
# он снят с открытого Wexflow намеренно, чтобы формат не оказался удобен
# ровно одному репозиторию.
#
# Проверить:      docpipe arch validate <этот файл>
# Не отстал ли:   docpipe arch status  <этот файл> --root .
# Что видит граф: docpipe arch records --root .

version: "1"

records: []
