# Конфигурация docpipe для АС CF (sbt.cms.cashflow).
#
# Инструмента в репозитории нет: он стоит на машине (`uv tool install`),
# а здесь живёт только настройка. Отсюда два вида путей, и путать их нельзя.
#
#   ВХОДЫ (rules, templates, ownership, registries, pages, arch) записаны
#   КОРОТКИМИ именами — относительно ЭТОГО каталога. Их разрешает вторая
#   ступень `resolve_input`: текущий каталог, затем каталог `docpipe.yaml`.
#   Поэтому каталог настройки можно перенести, не правя ни строки здесь.
#
#   ЦЕЛИ ЗАПИСИ (out, worklist, web.out, web.link_out, graph.out) и пути
#   от --root (cache_dir, business_root, docs_scan_exclude) второй ступени
#   НЕ получают: угадывать, куда писать, инструмент не должен. Их подставил
#   установщик при деплое, и они отсчитываются от КОРНЯ РЕПОЗИТОРИЯ.
#
# Поэтому команду зовут из корня репозитория:
#
#     cd $WORK/cfml/sbt.cms.cashflow
#     docpipe scan --root . --config @CONFIG_DIR@/docpipe.yaml
#
# Полностью — в README.md рядом с этим файлом.

# Корень обхода. Задаётся флагом `--root`; поле оставлено для совместимости.
roots:
  - "."

# --------------------------------------------------------------------------
# Что документируем
# --------------------------------------------------------------------------
# Глоб сравнивается с путём `.csproj`. Список только положительный: отрицаний
# нет, продуктовые каталоги перечисляются явно.
#
# ЭТО ГЛАВНОЕ, ЧТО НУЖНО УТОЧНИТЬ ПЕРВЫМ ДЕЛОМ. В репозитории 491 проект,
# и пока сюда не вписана реальная раскладка, документируется всё подряд.
# Посмотреть раскладку:
#
#     find . -name '*.csproj' -printf '%h\n' | cut -d/ -f2 | sort | uniq -c | sort -rn
#
# Неenrolled проект всё равно разбирается — его символы нужны графу
# наследования, — но документов не порождает.
enrolled:
  - "src/**"

# --------------------------------------------------------------------------
# Куда не заходить вовсе
# --------------------------------------------------------------------------
# Складывается со встроенными `**/obj/**`, `**/bin/**`, `**/*.g.cs`, а не
# замещает их.
#
# Шаблон обязан заканчиваться на `/**`, иначе он совпадёт только с самим
# каталогом, но не с файлами под ним, — и будет выглядеть работающим.
#
# `docs/**` исключён по двум причинам:
#   1. это дерево документации, а не исходники продукта;
#   2. внутри лежит каталог настройки инструмента (@CONFIG_DIR@) вместе
#      с артефактами прогона. Кода инструмента здесь больше нет — он ставится
#      на машину, — но манифест и индекс графа никуда не делись, и разбирать
#      их как исходники незачем.
exclude:
  - "docs/**"

# --------------------------------------------------------------------------
# Смысловая группировка модулей
# --------------------------------------------------------------------------
# Проверяется первый совпавший глоб в лексикографическом порядке ключей,
# а не в порядке записи: перестановка строк не должна менять манифест.
# Без совпадения доменом становится имя модуля.
domains: {}
  # "src/**/*.Pricing.*/**": "pricing"
  # "src/**/*.Risk.*/**": "risk"
  # "src/**/*.Common*/**": "platform"

# --------------------------------------------------------------------------
# Правила классификации
# --------------------------------------------------------------------------
# Настроенный под АС CF набор. Он здесь один: эталонный в поставку не входит,
# отличия от него помечены пометками «АС CF» в самом rules.yaml.
#
# ВАЖНО: флаг `--config` обязателен. Без него значение `rules` по умолчанию —
# `rules/rules.yaml` относительно текущего каталога, и прогон молча возьмёт
# не тот набор, а не откажется.
rules: "rules.yaml"

# Куда писать манифест и сидкар `doc-tree.run.json` рядом с ним.
out: "@CONFIG_DIR@/artifacts/doc-tree.json"

# Очередь для шага 3 — артефакт для чужого процесса, не отчёт для человека.
# Задан явно по той же причине, что и `out`: умолчание отсчитывается
# от текущего каталога, и очередь легла бы в корень репозитория продукта.
worklist: "@CONFIG_DIR@/artifacts/doc-worklist.json"

# Кэш разобранных файлов. Путь АБСОЛЮТНЫЙ и ведёт ВНЕ репозитория: дерево
# продукта не место для гигабайта машинного кэша, а `.gitignore` от случайного
# коммита защищает хуже, чем отсутствие файлов. Подставил установщик.
#
# Делить его между репозиториями безопасно: запись адресуется хэшем содержимого
# файла, а не путём, поэтому совпадение пути при разном содержимом даёт промах,
# а не чужой разбор.
cache_dir: "@CACHE_DIR@/parse"

# --------------------------------------------------------------------------
# Шаг 2: материализация документов
# --------------------------------------------------------------------------
# Скелеты документов, по одному на значение `template` из rules.yaml, плюс
# заполненные образцы в подкаталоге `examples/`. Кладёт их install.sh, ваши
# правки при обновлении сохраняются (новая версия приходит как `*.new`).
#
# Путь ЗДЕСЬ ОБЯЗАТЕЛЕН. Значение по умолчанию — "templates" относительно
# ТЕКУЩЕГО каталога, а не `--root`; команды зовутся из корня репозитория АС CF,
# то есть по умолчанию искался бы несуществующий <корень>/templates,
# и materialize падал бы на «Каталог шаблонов не найден».
#
# Короткое имя работает благодаря второй ступени поиска — каталогу ЭТОГО файла.
# Именно ради неё оно и короткое: путь от корня пришлось бы править при каждом
# переносе каталога настройки, а он теперь задаётся при деплое.
templates: "templates"

# Корень дерева документации: относительно `--root`.
docs_root: "docs"

# Куда не заходить при поиске существующих документов. Складывается со
# встроенным списком (`**/.venv/**`, `**/site-packages/**`, `**/node_modules/**`,
# `**/.git/**`), а не замещает его.
#
# Инструмент лежит ВНУТРИ дерева документации, поэтому его каталог исключается
# обязательно: иначе обход пойдёт по окружению .venv и по шаблонам поставки.
# Отдельно от `exclude` выше: тот про обход исходников, этот — про обход
# документов, и это разные деревья.
docs_scan_exclude:
  - "@CONFIG_DIR@/**"

# Правила владения документами. Файл приезжает заготовкой: команд нет, правил
# нет — у всех документов `team: null`. Работать это не мешает, но `--team`
# ничего не отбирает, а `docs owners --lint` покажет весь манифест ничьим.
# Заполняется по мере того, как становится понятно, кто за что отвечает;
# порядок работы описан в самом файле.
ownership: "ownership.yaml"

# --------------------------------------------------------------------------
# Бизнес-слой
# --------------------------------------------------------------------------
# Описание реестров платформы: где объявлены джобы, workflow, сервисы кластера
# и обработчики событий. Без этого ключа `docpipe anchors` и `docpipe business`
# отказываются работать: искать точки входа им негде.
#
# Пути ВНУТРИ файла тоже от корня репозитория АС CF, и сверить их с реальной
# раскладкой субрепозиториев нужно первым делом: нечитаемый файл прогон
# не роняет, поэтому неверный путь выглядит как «точек входа 0», а не как
# ошибка.
registries: "registries.yaml"

# Корень каталога бизнес-документов; путь относительно `--root`.
#
# Заведён внутри каталога инструмента намеренно: первым его наполняет команда,
# которая инструмент и ставила. Когда каталог понадобится другим командам,
# его выносят наверх — это правка одной строки здесь, потому что путь документа
# выводится из его идентификатора, а не хранится.
#
# Каталог попадает под `docs_scan_exclude` ниже, и это правильно: бизнес-документы
# отбираются по `docpipe.schema: business/1`, а не обходом дерева шага 2.
business_root: "@CONFIG_DIR@/business"

# --------------------------------------------------------------------------
# Шаг `web`: фронтенд на Angular
# --------------------------------------------------------------------------
# Секция необязательна для шага 1, но БЕЗ НЕЁ `docpipe web scan` не работает:
# все четыре ключа берут умолчания, и все четыре на этой раскладке неверны.
# `rules` по умолчанию — `rules/web.yaml` относительно ТЕКУЩЕГО каталога,
# `out` и `link_out` — `artifacts/…` тоже относительно текущего, то есть
# в корень репозитория продукта и мимо .gitignore инструмента.
#
# Порядок настройки тот же, что у шага 1:
#
#     web scan --stats   -> посмотреть срез «решение не принято» и модули
#     -> дописать правило в секцию `web` файла rules.yaml -> повторить
web:
  # Где искать фронты. Семь модулей разведаны в docs/findings-cashflow-frontend.md;
  # начинать имеет смысл с одного (ML), а не со всех сразу: правила
  # настраиваются под раскладку, и на семи сразу непонятно, какая из них
  # дала непокрытый символ.
  roots:
    - "sbt.cms.cashflow.subrepo/Sbt.CMS.Cashflow.ML"
    # - "sbt.cms.cashflow.subrepo/Sbt.CMS.Cashflow.Front"
    # - "sbt.cashflow.tm.subrepo/TypedModels.Front.Angular"
    # - "sbt.cashflow.portfolio.subrepo/PM.Front"
    # - "sbt.cms.subrepo/Sbt.CMS.Front"            # nx, а не angular.json
    # - "sbt.cashflow.realty.subrepo/Sbt.Cashflow.Front.Angular"
    # - "sbt.cashflow.stresstest/StressTest.Front"

  # Тот же файл, что и у шага 1, — секция `web` внутри него.
  rules: "rules.yaml"

  # Ручной состав страниц: чем дополнить и что снять с того, что нашёл обход.
  # Пустой файл — законное состояние; см. docs/pages.md.
  pages: "pages.yaml"

  # Вторая ветка дерева документации: каталог ВНУТРИ `docs_root`, рядом
  # с `modules_dir` бэкенда, а не под ним.
  #
  #   <docs_root>/<modules_dir>/...   бэкенд, единица документации — класс
  #   <docs_root>/front-docs/...      фронт,  единица документации — страница
  #
  # На настроенной поставке (docs_root: docs/ml/documentation,
  # modules_dir: tech-docs) это даёт docs/ml/documentation/front-docs/…
  #
  # Зачем разводить: у фронта половина узлов вообще не получает файла — их
  # описывает документ страницы. В одном каталоге с бэкендом это дерево
  # читается как то же самое, при том что искать в нём надо другое.
  #
  # ВНИМАНИЕ: смена значения меняет `doc_path` у всех узлов фронта. Прогон
  # откажется, пока манифест не пересобран; после `web scan` документы
  # переносятся автоматически и получают отметку о пересмотре.
  modules_dir: "front-docs"

  # Манифест фронта и отчёт связи фронт↔бэк. Рядом с манифестом шага 1,
  # чтобы попасть под ту же строку .gitignore.
  out: "@CONFIG_DIR@/artifacts/doc-tree.web.json"
  link_out: "@CONFIG_DIR@/artifacts/web-link.json"

  # Что прокси модуля делает с URL по дороге к бэкенду. Без этого маршрут
  # фронта не сойдётся с маршрутом контроллера, и `web link` покажет вызовы
  # несопоставленными.
  #
  # ОТСУТСТВИЕ ЗАПИСИ О МОДУЛЕ — НЕ «преобразования нет». Это ненастроенный
  # модуль, и отчёт связи называет его вслух; пустые поля при указанном
  # `module` означают «проверено, не преобразуется».
  #
  # Имя модуля берётся из вывода `web scan --stats`, а не придумывается:
  # его считает сам инструмент из angular.json / project.json / package.json.
  # Префиксы разведаны (docs/findings-cashflow-frontend.md, раздел про прокси):
  #
  #   ML                          префикса нет
  #   PM.Front                    ^/pm      -> ''
  #   Sbt.CMS.Cashflow.Front      ^/cf      -> ''
  #   Sbt.Cashflow.Front.Angular  ^/realty  -> ''
  #   TypedModels.Front.Angular   ^/tm      -> ''
  #   Sbt.CMS.Front (admin)       ^/api/    -> /admin/api/   ДОПИСЫВАЕТСЯ
  url_rewrite: []

  # Маршруты платформы, у которых смысл вызова определяет не маршрут,
  # а значение параметра: `api/items/query` с `listInnerName` в теле и
  # `api/items?listInnerName=…` в query — один маршрут на много смыслов.
  # Различитель идёт в ключ вызова, но НЕ участвует в сопоставлении
  # с эндпоинтом. Заполняется, когда дойдёт до модулей, читающих реестр.
  registry_calls: []

# --------------------------------------------------------------------------
# Нормализованный реестр архитектурных элементов (R03)
# --------------------------------------------------------------------------
# Точки входа, объявленные данными, узлы данных, швы между языками, роли
# модулей — всё, чего в коде нет структурно и что поэтому не найдёт разбор.
# Приезжает ПУСТЫМ и при обновлении сохраняется: в нём решения человека.
#
# Пустой реестр валиден, выдуманный путь к нему — нет. Заполняется разведкой:
# `python3 tools/recon.py --root .` из клона инструмента, затем скилл `recon`
# готовит черновик, а записи в этот файл переносит человек, меняя провенанс
# на `skill_confirmed`. Черновик со `skill_proposed` этот файл не принимает.
#
# Вход, поэтому короткое имя: разрешается от каталога этого файла.
arch: "arch-registry.yaml"

# Адаптеры читают исходные реестры при каждой сборке, а не разово. Пустой
# список — рабочее состояние: снимок в `arch` остаётся способом, и на
# репозитории, который видишь впервые, он единственный.
arch_adapters: []

# --------------------------------------------------------------------------
# Индекс связей (шаг graph)
# --------------------------------------------------------------------------
# Секцию читает ТОЛЬКО `docpipe graph *`. Ни шаг 1, ни шаг 2, ни бизнес-слой
# её не касаются — ради этого индекс и собирается рядом с манифестом, а не
# внутри него.
graph:
  # Путь к движку разбора (codebase-memory-mcp 0.6.0). Умолчания у ключа нет
  # намеренно: «поищем в PATH» означает запуск того, что нашлось, а версия
  # определяет и числа, и качество разрешения вызовов. Пусто — отказ.
  # Подставил установщик по флагу --engine.
  engine_path: "@ENGINE@"

  # Пусто — «взять закреплённую сумму из моста». Расхождение НЕ блокирует:
  # бинарь не воспроизводим бит в бит, и на контуре стои́т своя сборка того же
  # 0.6.0 — это предупреждение в stderr плюс фактическая сумма в паспорте
  # индекса (`docpipe graph info`). Отказом осталась версия по `--version`.
  # Чтобы закрепить свою сборку и убрать предупреждение — впишите её сумму.
  engine_sha256: ""

  # fast / moderate / full. `fast` — то, на чём сняты все замеры: на abp
  # полный цикл 10,7 с против бюджета в 5 минут.
  mode: "fast"

  # Цель записи: от текущего каталога, как `out`. Подставил установщик.
  out: "@CONFIG_DIR@/artifacts/graph.db"

  # Кэш движка — ВНЕ репозитория, рядом с кэшем разбора и по той же причине:
  # он крупный, машинный и в дереве продукта ему делать нечего.
  cache_dir: "@CACHE_DIR@/engine"
