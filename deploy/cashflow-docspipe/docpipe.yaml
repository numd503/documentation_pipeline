# Конфигурация docpipe для АС CF (sbt.cms.cashflow).
#
# Пути внутри файла заданы относительно КОРНЯ РЕПОЗИТОРИЯ АС CF, а не этого
# каталога. Поэтому вручную команду запускают из корня репозитория:
#
#     cd $WORK/cfml/sbt.cms.cashflow
#     uv run --no-sync --project docs/ml/docspipe python -m docpipe scan \
#         --root . --config docs/ml/docspipe/cashflow-docspipe/docpipe.yaml
#
# Переменные окружения и алиас, чтобы не набирать это каждый раз, — в README.md
# рядом с этим файлом.

# Корень обхода. Задаётся флагом `--root`; поле оставлено для совместимости.
roots:
  - "."

# --------------------------------------------------------------------------
# Что документируем
# --------------------------------------------------------------------------
# Глоб сравнивается с путём `.csproj`. Список только положительный: отрицаний
# нет, продуктовые каталоги перечисляются явно.
#
# ЭТО ГЛАВНОЕ, ЧТО НУЖНО УТОЧНИТЬ ПЕРВЫМ ДЕЛОМ. В репозитории 491 проект,
# и пока сюда не вписана реальная раскладка, документируется всё подряд.
# Посмотреть раскладку:
#
#     find . -name '*.csproj' -printf '%h\n' | cut -d/ -f2 | sort | uniq -c | sort -rn
#
# Неenrolled проект всё равно разбирается — его символы нужны графу
# наследования, — но документов не порождает.
enrolled:
  - "src/**"

# --------------------------------------------------------------------------
# Куда не заходить вовсе
# --------------------------------------------------------------------------
# Складывается со встроенными `**/obj/**`, `**/bin/**`, `**/*.g.cs`, а не
# замещает их.
#
# Шаблон обязан заканчиваться на `/**`, иначе он совпадёт только с самим
# каталогом, но не с файлами под ним, — и будет выглядеть работающим.
#
# `docs/**` исключён по двум причинам:
#   1. внутри лежит сам docpipe (docs/ml/docspipe) вместе с окружением .venv —
#      обходить его бессмысленно, а если рядом окажутся .cs-фикстуры, они
#      попадут в манифест как настоящие модули продукта;
#   2. когда добавится разбор .py, каталог с инструментом стал бы для него
#      входными данными: docpipe принялся бы документировать сам себя.
exclude:
  - "docs/**"

# --------------------------------------------------------------------------
# Смысловая группировка модулей
# --------------------------------------------------------------------------
# Проверяется первый совпавший глоб в лексикографическом порядке ключей,
# а не в порядке записи: перестановка строк не должна менять манифест.
# Без совпадения доменом становится имя модуля.
domains: {}
  # "src/**/*.Pricing.*/**": "pricing"
  # "src/**/*.Risk.*/**": "risk"
  # "src/**/*.Common*/**": "platform"

# --------------------------------------------------------------------------
# Правила классификации
# --------------------------------------------------------------------------
# Настроенный под АС CF набор. Он здесь один: эталонный в поставку не входит,
# отличия от него помечены пометками «АС CF» в самом rules.yaml.
#
# ВАЖНО: путь задан относительно КОРНЯ репозитория АС CF, а флаг `--config`
# обязателен. Без него значение `rules` по умолчанию — `rules/dotnet.yaml`
# относительно текущего каталога, и прогон возьмёт не тот набор.
rules: "docs/ml/docspipe/cashflow-docspipe/rules.yaml"

# Куда писать манифест и сидкар `doc-tree.run.json` рядом с ним.
out: "docs/ml/docspipe/cashflow-docspipe/artifacts/doc-tree.json"

# Кэш разобранных файлов; путь относительно `--root`. Лежит внутри каталога
# инструмента, а не в корне репозитория, чтобы не засорять рабочее дерево
# продукта. Каталог уже закрыт в docs/ml/docspipe/.gitignore.
cache_dir: "docs/ml/docspipe/cashflow-docspipe/.cache"

# --------------------------------------------------------------------------
# Шаг 2: материализация документов
# --------------------------------------------------------------------------
# Скелеты документов, по одному на значение `template` из rules.yaml, плюс
# заполненные образцы в подкаталоге `examples/`. Кладёт их install.sh, ваши
# правки при обновлении сохраняются (новая версия приходит как `*.new`).
#
# Путь ЗДЕСЬ ОБЯЗАТЕЛЕН. Значение по умолчанию — "templates" относительно
# ТЕКУЩЕГО каталога, а не `--root`; команды зовутся из корня репозитория АС CF,
# то есть по умолчанию искался бы несуществующий <корень>/templates,
# и materialize падал бы на «Каталог шаблонов не найден».
#
# Вторая ступень поиска — каталог этого файла, — сделала бы рабочим и короткое
# "templates". Явный путь от корня оставлен намеренно: он читается одинаково
# из любого каталога, и менять работающую поставку ради краткости незачем.
templates: "docs/ml/docspipe/cashflow-docspipe/templates"

# Корень дерева документации: относительно `--root`.
docs_root: "docs"

# Куда не заходить при поиске существующих документов. Складывается со
# встроенным списком (`**/.venv/**`, `**/site-packages/**`, `**/node_modules/**`,
# `**/.git/**`), а не замещает его.
#
# Инструмент лежит ВНУТРИ дерева документации, поэтому его каталог исключается
# обязательно: иначе обход пойдёт по окружению .venv и по шаблонам поставки.
# Отдельно от `exclude` выше: тот про обход исходников, этот — про обход
# документов, и это разные деревья.
docs_scan_exclude:
  - "docs/ml/**"

# Правила владения документами. Файл приезжает заготовкой: команд нет, правил
# нет — у всех документов `team: null`. Работать это не мешает, но `--team`
# ничего не отбирает, а `docs owners --lint` покажет весь манифест ничьим.
# Заполняется по мере того, как становится понятно, кто за что отвечает;
# порядок работы описан в самом файле.
ownership: "docs/ml/docspipe/cashflow-docspipe/ownership.yaml"

# --------------------------------------------------------------------------
# Бизнес-слой
# --------------------------------------------------------------------------
# Описание реестров платформы: где объявлены джобы, workflow, сервисы кластера
# и обработчики событий. Без этого ключа `docpipe anchors` и `docpipe business`
# отказываются работать: искать точки входа им негде.
#
# Пути ВНУТРИ файла тоже от корня репозитория АС CF, и сверить их с реальной
# раскладкой субрепозиториев нужно первым делом: нечитаемый файл прогон
# не роняет, поэтому неверный путь выглядит как «точек входа 0», а не как
# ошибка.
registries: "docs/ml/docspipe/cashflow-docspipe/registries.yaml"

# Корень каталога бизнес-документов; путь относительно `--root`.
#
# Заведён внутри каталога инструмента намеренно: первым его наполняет команда,
# которая инструмент и ставила. Когда каталог понадобится другим командам,
# его выносят наверх — это правка одной строки здесь, потому что путь документа
# выводится из его идентификатора, а не хранится.
#
# Каталог попадает под `docs_scan_exclude` ниже, и это правильно: бизнес-документы
# отбираются по `docpipe.schema: business/1`, а не обходом дерева шага 2.
business_root: "docs/ml/docspipe/cashflow-docspipe/business"
