# Манифест поставки: то же, что в корне репозитория, но без всего, что нужно
# только разработке. Ни ruff, ни mypy, ни pytest на целевой машине не ставятся
# и в `uv.lock` рядом с этим файлом не входят.
#
# Совпадение runtime-зависимостей с корневым `pyproject.toml` проверяется тестом
# `tests/test_deploy_bundle.py`: разъехавшаяся поставка — это ошибка, которая
# обнаруживается на чужой машине и в неудобный момент.
[project]
name = "docpipe"
version = "0.1.0"
description = "Детерминированное построение структуры документации по исходному коду"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-c-sharp>=0.23,<0.24",
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "pyyaml>=6,<7",
]

[project.scripts]
docpipe = "docpipe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docpipe"]
