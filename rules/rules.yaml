# Правила классификации: один файл, по секции на шаг.
#
# `dotnet` читают `scan`, `symbols` и `validate`; `web` — `web scan`. Секцию
# называет вызывающий, и умолчания у неё нет: плоский файл, прочитанный шагом
# `web`, дал бы .NET-правила на TypeScript, а `require_public: true` отсеял бы
# весь фронт разом — без единого сообщения об ошибке.

version: "1"

dotnet:
  # Правила классификации типов .NET.
  #
  # Это данные, а не код: добавить вид сущности — значит дописать сюда правило
  # и завести шаблон. Граница пайплайна проходит ровно здесь: решение «этот класс —
  # контроллер» принимает правило, решение «что этот контроллер делает» — агент шага 3.
  #
  # Набор намеренно консервативен. Настраивать его нужно по `docpipe scan --stats`
  # на конкретном репозитории: доля unclassified показывает, каких правил не хватает.

  ruleset_version: "2026-07-30.1"

  # Решения «не документируем». Проверяются до правил классификации.
  #
  # Каждое решение обязано нести `reason`: отчёт `scan --stats` показывает, сколько
  # символов отсеяно каким решением и почему, и это единственное, что отличает
  # «посмотрели и решили, что не надо» от «ещё не смотрели». Второе в отчёте
  # называется «решение не принято» и должно быть доведено до нуля.
  #
  # Условия — те же десять предикатов, что в правилах классификации ниже,
  # включая `attribute`, `namespace_regex` и `inherits`. Генерат, различимый
  # только атрибутом, отсекается здесь же, а не подгонкой шаблона пути.
  exclude:
    # Глобальный переключатель, а не решение о группе типов: «документируем ли мы
    # внутреннюю кухню». Правилом не выражается — отрицания в движке нет намеренно.
    require_public: true

    # У правила отсева бывает поле `unless` — вырез внутри его группы. Правило
    # совпадает, когда `when` истинно И `unless` ложно:
    #
    #     - id: grid.support
    #       reason: "Вспомогательные типы каталога сервисов"
    #       when:
    #         path_glob: ["src/Grid/**"]
    #       unless:
    #         inherits: ["GridService"]
    #
    # Нужно там, где в каталоге лежит один вид документируемых типов и много
    # вспомогательных, а описать вспомогательные положительно не выходит.
    # Приоритетом это не решается: `exclude` — стадия ДО правил классификации,
    # и приоритеты двух стадий не сравниваются никогда.
    #
    # Это единственная форма отрицания в движке, и она узкая намеренно: общий
    # `not` внутри дерева условий превращает набор в систему уравнений, которую
    # нельзя прочитать построчно.
    rules:
      - id: generated.code
        reason: "Сгенерированный код: документ был бы пересказом генератора и переписывался бы при каждой перегенерации"
        priority: 100
        when:
          path_glob:
            - "**/obj/**"
            - "**/bin/**"
            - "**/*.g.cs"
            - "**/*.Designer.cs"
            - "**/*.generated.cs"
            - "**/Migrations/**"

      # Одного условия по имени типа мало, и это неочевидно: в тестовых проектах
      # полно вспомогательных типов, которые называются как продуктовые
      # (`AuditTestController`, `AuthorizationTestPermissionDefinitionProvider`)
      # и потому проходят обычные правила. На ABP таких 104 узла из 828.
      # Отсекает их только путь. Оба условия нужны, поэтому они в одном решении:
      # причина у них одна, и разносить её по двум записям значило бы дважды
      # объяснять одно и то же.
      - id: tests
        reason: "Тестовый код: документируется продуктовый, а не то, чем он проверяется"
        priority: 90
        when:
          any:
            - path_glob:
                - "**/test/**"
                - "**/tests/**"
                - "**/*Test/**"
                - "**/*Tests/**"
            # `*Tests` встречается на порядок чаще `*Test` (в ABP 777 против 54),
            # поэтому `s` обязательна и необязательна одновременно.
            #
            # ВНИМАНИЕ для предметных областей, где «тест» — бизнес-понятие:
            # в финансовом моделировании `StressTest` или `BackTest` могут быть
            # настоящими сущностями. Тогда это условие нужно сузить.
            - name_regex: ["^.*Tests?$"]

      - id: data.contracts
        reason: "Контракт передачи данных: смысл в вызывающем коде, а не в самом типе"
        priority: 50
        when:
          name_regex:
            - "^.*Dto$"
            - "^.*Request$"
            - "^.*Response$"
            - "^.*Options$"
            - "^.*Settings$"

      - id: enums
        reason: "Перечисление документируется в составе типа, который его использует"
        priority: 10
        when:
          type_kind: ["enum"]

  rules:
    - id: controller.aspnet
      kind: controller
      template: controller
      priority: 100
      when:
        any:
          - attribute: ["ApiController"]
          - base_type: ["ControllerBase", "Controller"]
          - inherits: ["ControllerBase", "Controller"]

    - id: ignite.service
      kind: ignite_service
      template: ignite-service
      priority: 95
      when:
        all:
          - type_kind: ["class", "record"]
          - inherits: ["IService", "Apache.Ignite.Core.Services.IService"]

    - id: ignite.compute
      kind: ignite_compute
      template: ignite-compute
      priority: 94
      when:
        all:
          - type_kind: ["class", "record"]
          - inherits: ["IComputeFunc", "IComputeJob", "IComputeTask"]

    - id: workflow
      kind: workflow
      template: workflow
      priority: 90
      when:
        all:
          - type_kind: ["class", "record"]
          - any:
              - name_suffix: ["Workflow"]
              - inherits: ["IWorkflow"]

    - id: provider
      kind: provider
      template: provider
      priority: 50
      when:
        all:
          - type_kind: ["class", "record"]
          - any:
              - name_suffix: ["Provider"]
              - inherits: ["IProvider"]

    - id: repository
      kind: repository
      template: repository
      priority: 45
      when:
        all:
          - type_kind: ["class", "record"]
          - name_suffix: ["Repository"]

    - id: service
      kind: service
      template: service
      priority: 40
      when:
        all:
          - type_kind: ["class", "record"]
          - name_suffix: ["Service"]

web:
  # Правила классификации символов фронтенда (Angular).
  #
  # Тот же движок, что у `rules/dotnet.yaml`, и те же десять предикатов. Матчинг
  # идёт по декоратору (`attribute`), по имени файла и пути (`path_glob`),
  # по имени (`name_suffix`) и по базовому типу (`inherits`).
  #
  # Набор минимальный: он доводится до состояния «`undecided` равно нулю»
  # в задаче F12, где заводятся отсевы с причинами и проверяется атрибуция
  # по приоритету.

  ruleset_version: "2026-08-09.web.1"

  exclude:
    # У TypeScript модификатора `public` на уровне объявления нет вовсе:
    # видимость задаётся словом `export`. Оставленный `true` отсеял бы
    # **все** символы фронта разом, и отчёт показал бы пустое дерево
    # без единого сообщения об ошибке.
    require_public: false

    rules:
      - id: web.spec
        reason: "Тест: обходом не исключается, потому что нужен резолву, но документом не становится"
        priority: 100
        when:
          path_glob:
            - "**/*.spec.ts"
            - "**/*.test.ts"

      - id: web.declaration
        reason: "Файл деклараций: описывает чужой контракт, а не наш код"
        priority: 99
        when:
          path_glob: ["**/*.d.ts"]

      - id: web.mock
        reason: "Мок: существует ради теста, документируется вместе с ним"
        priority: 98
        when:
          path_glob: ["**/*.mock.ts", "**/mocks/**"]

      - id: web.environment
        reason: "Конфигурация сборки: значения различаются между окружениями и меняются вне кода"
        priority: 97
        when:
          path_glob: ["**/environments/**"]

      - id: web.bootstrap
        reason: "Точка входа приложения: состав провайдеров, а не поведение"
        priority: 96
        when:
          path_glob: ["**/main.ts", "**/polyfills.ts"]

      # Константа модуля с URL или значением: документируется вместе с сервисом,
      # который её использует. Отдельный документ на `export const auditUrl`
      # пересказывал бы одну строку.
      #
      # `unless` здесь обязателен, и вот почему: отсев проверяется ДО правил
      # классификации, а функциональный интерцептор, guard и таблица роутов —
      # тоже константы. Без выреза этот отсев съел бы их все разом, и в дереве
      # не осталось бы ни одного интерцептора при том, что в АС CF они объявлены
      # именно так.
      - id: web.module-constant
        reason: "Константа модуля: документируется вместе с сервисом, который её использует"
        priority: 50
        when:
          type_kind: ["const"]
        unless:
          any:
            - name_suffix: ["Interceptor", "Guard", "Resolver"]
            - path_glob: ["**/*.routes.ts", "**/routesPath/**"]

  # Два вида решаются НЕ здесь, и это не пробел набора: `page` и `api-service`
  # зависят от фактов, которых движок правил не видит.
  #
  #   page         компонент, до которого можно дойти по таблице роутов;
  #                таблица собирается межфайлово (F08), символ о ней не знает;
  #   api-service  сервис, который делает HTTP-вызовы; вызовы разбираются
  #                отдельно (F07), и в `Symbol` их тоже нет.
  #
  # Оба повышения делает `web/tree.py` после классификации: правило говорит
  # «это компонент», а таблица роутов — «этот компонент является страницей».
  # Выразить их предикатом по имени или пути можно было бы только угадыванием,
  # а угаданная страница ломает якорь бизнес-документа.
  rules:
    - id: web.component
      kind: component
      template: component
      priority: 100
      when:
        attribute: ["Component"]

    - id: web.state
      kind: state
      template: state
      priority: 99
      when:
        attribute: ["State"]

    - id: web.module
      kind: ng-module
      template: component
      priority: 98
      when:
        attribute: ["NgModule"]

    - id: web.pipe
      kind: pipe
      template: component
      priority: 97
      when:
        attribute: ["Pipe"]

    - id: web.directive
      kind: directive
      template: component
      priority: 96
      when:
        attribute: ["Directive"]

    # Интерцептор проверяется ДО сервиса: у класса-интерцептора есть и `@Injectable`,
    # и `implements HttpInterceptor`, и без приоритета он стал бы обычным сервисом.
    - id: web.interceptor
      kind: interceptor
      template: service
      priority: 95
      when:
        any:
          - inherits: ["HttpInterceptor"]
          - base_type: ["HttpInterceptor"]
          - name_suffix: ["Interceptor"]

    - id: web.guard
      kind: guard
      template: service
      priority: 94
      when:
        name_suffix: ["Guard"]

    - id: web.service
      kind: service
      template: service
      priority: 90
      when:
        all:
          - type_kind: ["class"]
          - any:
              - attribute: ["Injectable"]
              - name_suffix: ["Service"]

    # Экшены NGXS: класс без декоратора, со статическим полем `type`.
    # Единственное стабильное литеральное звено цепочки — строка типа экшена.
    - id: web.action
      kind: action
      template: service
      priority: 80
      when:
        all:
          - type_kind: ["class"]
          - path_glob: ["**/*.actions.ts"]

    - id: web.routes
      kind: routes
      template: service
      priority: 70
      when:
        all:
          - type_kind: ["const"]
          - path_glob: ["**/*.routes.ts", "**/routesPath/**"]

    - id: web.dto
      kind: dto
      template: dto
      priority: 60
      when:
        type_kind: ["interface", "enum"]
