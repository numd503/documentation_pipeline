[project]
name = "docpipe"
version = "0.1.0"
description = "Детерминированная структура документации по исходному коду и контроль её актуальности"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-c-sharp>=0.23,<0.24",
    "tree-sitter-typescript>=0.23,<0.24",
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "pyyaml>=6,<7",
]

[project.scripts]
docpipe = "docpipe.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docpipe"]

[tool.ruff]
line-length = 100
target-version = "py312"
# В docs/ лежат markdown-документы с намеренно компактными псевдо-сигнатурами
# в python-блоках. Это проза, форматировать её как код не нужно.
extend-exclude = ["docs", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# Pyright нужен не для проверки (это делает mypy), а агенту для навигации:
# LSP-плагин Claude Code. Сам он `.venv` не ищет и берёт `python` из PATH,
# и тогда каждая правка приносит ложные «import not resolved» на pydantic
# и tree_sitter. Тесты mypy не проверяет — их диагностику глушим, а переход
# к определению и поиск ссылок в них остаются.
[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
ignore = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
