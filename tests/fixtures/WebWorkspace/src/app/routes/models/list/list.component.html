<section class="models-list">
  <form [formGroup]="form">
    <input formControlName="search" placeholder="Поиск модели" />
  </form>

  <ul>
    <li *ngFor="let model of models">{{ model.title }}</li>
  </ul>

  <!--
    Вызов из шаблона: `.ts` его не видит вовсе. Без разбора шаблона `save`
    выглядит методом, которого никто не зовёт, а страница — не связанной
    с сервисом, который за ним стоит.
  -->
  <button type="button" (click)="save()">Сохранить</button>
  <span class="total">{{ total() }}</span>

  <!--
    Обращение к внедрённому сервису прямо из разметки: сервис зовут в обход
    методов компонента, и в `.ts` этого вызова нет ни одного.
  -->
  <ul class="audit">
    <li *ngFor="let item of audit.list() | async">{{ item }}</li>
  </ul>
</section>
