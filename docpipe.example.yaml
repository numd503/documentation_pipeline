# Пример конфигурации docpipe. Скопируйте в свой репозиторий и правьте под него.
#
#     uv run docpipe scan --root . --config docpipe.yaml --out artifacts/doc-tree.json
#
# Файл называется `.example.`, потому что автоматически он не подхватывается:
# путь всегда задаётся флагом `--config`. Конфигурация без этого флага молча
# не применялась бы, а это худший вид ошибки — тот, который выглядит как успех.
#
# Пошаговая инструкция по настройке — в README.md, раздел «Настройка под конкретный
# проект». Для АС CF есть отдельный чек-лист: CASHFLOW.md.

# Корень обхода задаётся флагом `--root`. Поле оставлено на будущее — когда
# в одном репозитории лежат независимые решения; сейчас оно не читается.
roots:
  - "."

# Какие проекты попадают в документацию. Глоб сравнивается с путём `.csproj`.
#
# Список только положительный: отрицаний нет, нужные каталоги перечисляются явно.
# Тестовые проекты сюда включать не нужно — но они всё равно разбираются,
# потому что их символы нужны графу наследования. Это разные вещи:
#   enrolled — «что документируем»;
#   exclude в секции dotnet файла rules/rules.yaml — «что не документируем, но читаем».
enrolled:
  - "src/**"
  # - "modules/*/src/**"

# Куда обход не заходит вовсе. Складывается со встроенными `**/obj/**`,
# `**/bin/**`, `**/*.g.cs`, а не замещает их.
#
# Это третье понятие рядом с двумя предыдущими, и путать их дорого:
#   enrolled — «что документируем»;
#   exclude в секции dotnet файла rules/rules.yaml — «что не документируем, но читаем»;
#   exclude здесь — «куда не заходим»: файл не читается и символов не даёт,
#   поэтому наследование через него рвётся.
#
# Нужно ровно для чужого кода внутри репозитория: сам инструмент, положенный
# внутрь сканируемого дерева, вендоренные зависимости, выгрузки.
#
# ЛОВУШКА: шаблон обязан заканчиваться на `/**`. `"docs"` совпадёт только
# с самим каталогом, но не с файлами под ним, — и будет выглядеть работающим.
exclude: []
  # - "docs/**"
  # - "third_party/**"

# Смысловая группировка модулей. Проверяется первый совпавший глоб
# в лексикографическом порядке ключей, а не в порядке записи в файле:
# перестановка строк не должна менять манифест.
#
# Без совпадения доменом становится имя модуля.
domains:
  # "src/Cf.Pricing.*/**": "pricing"
  # "src/Cf.Risk.*/**": "risk"
  # "src/Cf.Common.*/**": "platform"

# Набор правил классификации. Отделён от этого файла намеренно: правила
# описывают, *что считать контроллером*, и переносятся между проектами,
# а конфигурация — *где искать код*, и своя у каждого.
rules: "rules/rules.yaml"

# Куда писать манифест. Путь относительно текущего каталога, а не `--root`.
# Флаг `--out` важнее, но только когда он действительно задан.
out: "artifacts/doc-tree.json"

# Кэш разобранных файлов, путь относительно `--root`. Каталог стоит добавить
# в `.gitignore` сканируемого репозитория. Если писать в чужое дерево нельзя —
# `--no-cache` или путь наружу.
cache_dir: ".docpipe/cache"

# ------------------------------------------------------------------------------------
# Шаг 2: материализация документов
# ------------------------------------------------------------------------------------

# Каталог скелетов. Их имена обязаны совпадать со значениями `template`
# в наборе правил — иначе прогон упадёт с явной ошибкой вместо молчаливой
# потери документов.
templates: "templates"

# Правила владения. Без файла у всех документов `team: null`, и это видимый
# факт, а не отсутствие строки.
# ownership: "ownership.yaml"

# Корень дерева документации, путь относительно `--root`.
docs_root: "docs"

# Каталог технической документации ВНУТРИ `docs_root`: вместе они дают префикс
# `doc_path` каждого узла, по умолчанию `docs/modules`.
#
#   docs_root: "documentation"  +  modules_dir: "tech"   ->  documentation/tech/...
#   docs_root: "docs"           +  modules_dir: ""       ->  docs/...
#
# Пара, а не один путь целиком, — намеренно: инвариант «то, что пишет
# `materialize`, лежит там, где ищет `docs status`» тогда держится структурно.
# Одним значением его можно было бы нарушить (`modules_root: "other/modules"`
# при `docs_root: "docs"`), и прогон писал бы документы туда, где их никто
# не ищет: каждый навсегда остался бы `missing` и переписывался заново.
#
# ВНИМАНИЕ: смена значения меняет `doc_path` у всех узлов сразу — ровно как
# смена `doc_layout` ниже, и переход тот же.
modules_dir: "modules"

# Раскладка документов внутри `docs/modules/`.
#
#   kind-first    docs/modules/gridservices/Sbt.Cf.Grid.AutoConclusion/x.md
#   module-first  docs/modules/Sbt.Cf.Grid.AutoConclusion/gridservices/x.md
#
# На коллизии выбор НЕ влияет: обе раскладки — перестановка одной тройки
# (модуль, вид, slug), поэтому за один файл узлы спорят в них одновременно,
# и разводит их один и тот же хэш-суффикс. Выбирать нужно по тому, как дерево
# читают: `kind-first` собирает все сущности вида в один каталог, `module-first`
# позволяет выбрать модуль целиком одним префиксом пути
# (`docs status МАНИФЕСТ docs/modules/Sbt.Cf.Grid.AutoConclusion`).
#
# ВНИМАНИЕ: смена значения меняет `doc_path` у всех узлов сразу. Документы
# при этом не теряются — `materialize` находит их по `node_id` и переносит,
# — но каждый принятый документ встанет в `relocated` и попросит пересмотра.
# Порядок перехода описан в `docs/materialize.md`.
doc_layout: "kind-first"

# Куда не заходить при поиске существующих документов. Складывается
# со встроенным списком (`**/.venv/**`, `**/site-packages/**`,
# `**/node_modules/**`, `**/.git/**`), а не замещает его.
#
# На АС CF инструмент лежит ВНУТРИ дерева документации, поэтому:
docs_scan_exclude: []
  # - "docs/ml/**"

# ------------------------------------------------------------------------------------
# Шаг 3: очередь для внешнего исполнителя
# ------------------------------------------------------------------------------------

# Куда `docpipe worklist` кладёт очередь документов. Путь относительно текущего
# каталога, как `out`, а не относительно `--root`: очередь — артефакт прогона,
# а не часть документации, и в дереве документов ей не место. Флаг `--out`
# важнее, но только когда он действительно задан.
worklist: "artifacts/doc-worklist.json"

# ------------------------------------------------------------------------------------
# Шаг `web`: фронтенд на Angular
# ------------------------------------------------------------------------------------

# Секция необязательна: репозиторий без фронта её не заводит, а умолчания дают
# рабочий прогон там, где фронт один. Манифест фронта — ОТДЕЛЬНЫЙ файл той же
# схемы: `materialize`, `docs status` и бизнес-слой работают от него, не зная
# про язык.
web:
  # Каталоги-модули фронта. Умолчание `["."]` — искать по всему репозиторию.
  # На АС CF семь фронтов, и сужение здесь экономит обход шести чужих.
  roots: ["."]

  rules: "rules/rules.yaml"
  out: "artifacts/doc-tree.web.json"
  link_out: "artifacts/web-link.json"

  # Ручной состав страниц: чем дополнить и что снять с того, что нашёл обход.
  # Пустое значение — файла нет, и это законно. См. docs/pages.md.
  pages: ""

  # Каталог документации фронта ВНУТРИ `docs_root` — вторая ветка рядом
  # с `modules_dir`, а не под ним:
  #
  #   docs/modules/...   бэкенд, единица документации — класс
  #   docs/front/...     фронт, единица документации — страница
  #
  # Пустое значение (умолчание) значит «та же ветка, что у бэкенда», и это
  # ради совместимости: конфигурации, написанные до появления ключа, обязаны
  # давать те же пути.
  #
  # ВНИМАНИЕ: смена значения меняет `doc_path` у всех узлов фронта сразу.
  # Прогон это заметит и откажется, пока манифест не пересобран; после
  # пересборки документы переносятся автоматически и получают отметку
  # о пересмотре — как при смене `doc_layout`.
  modules_dir: ""

  # Что делает с URL прокси модуля по дороге к бэкенду. Повторяет `pathRewrite`
  # из `proxy.conf`: литерал `/pm/api/limits/getperiods` во фронте и маршрут
  # `api/limits/getperiods` в контроллере — ОДИН эндпоинт, и без этой таблицы
  # они разъедутся по двум корзинам: «вызов без эндпоинта» плюс «эндпоинт
  # без вызывающего».
  #
  # ВНИМАНИЕ: пустые поля и отсутствие записи — РАЗНЫЕ вещи. Первое значит
  # «проверено, преобразования нет» (так у Sbt.CMS.Cashflow.ML: контекст '/**',
  # переписывания пути нет). Второе — «модуль не настроен», и отчёт связи
  # обязан назвать его вслух, иначе забытая настройка выглядит как исправная
  # связь. Значение ставит человек, прочитавший `proxy.conf` и интерцептор.
  url_rewrite: []
    # - module: "tr-p"          # имя проекта из angular.json
    #   strip_prefix: ""        # проверено: префикса нет
    # - module: "PM.Front"
    #   strip_prefix: "/pm"     # pathRewrite: {'^/pm': ''}
    # - module: "admin"
    #   add_prefix: "/admin"    # pathRewrite: {'^/api/': '/admin/api/'}

  # Маршруты платформы, где смысл вызова определяет не маршрут, а параметр.
  # `api/items/query` с `listInnerName` в теле и `api/items?listInnerName=…`
  # в query — один маршрут на много смыслов: без этой таблицы обращения
  # к пользователям, к моделям и к справочникам склеятся в одну точку.
  # Одного правила на оба случая не хватает — их два у одного и того же API.
  registry_calls: []
    # - route: "api/items/query"
    #   discriminator: { in: body, name: listInnerName }
    #   kind: list
    # - route: "api/items"
    #   discriminator: { in: query, name: listInnerName }
    #   kind: list

# ────────────────────────────────────────────────────────────────────────────────────────
# Разведка и граф: нормализованный реестр архитектурных элементов (R03, R04)
# ────────────────────────────────────────────────────────────────────────────────────────

# Снимок реестра: точки входа, узлы данных, швы, слои. Вход инструмента,
# поэтому путь разрешается двумя ступенями — от текущего каталога, затем
# от каталога этой конфигурации.
#
# Значения по умолчанию нет намеренно: реестр — решение о репозитории,
# а не файл, который заводится сам. Пустой реестр валиден, выдуманный путь — нет.
# Формат и заполнение: docs/arch-registry.md, пример — arch-registry.example.yaml.
# arch: arch-registry.yaml

# Адаптеры реестров: читают исходные реестры при КАЖДОЙ сборке, а не хранят
# снимок. Подключаются по имени, ветвления в ядре нет: `adapter` — имя из
# списка известных, `options` — его параметры, и адаптер проверяет их строго.
#
# Пустой список — рабочее состояние. Снимок остаётся способом, а на репозитории,
# который видишь впервые, он единственный: адаптер стоит реализации на семейство
# форматов, снимок работает для чего угодно, включая формат, который мы видим
# первый раз в жизни.
arch_adapters: []
  # - id: платформенные-реестры
  #   adapter: registries          # читает registries.yaml: XML, JSON, переходы по ссылкам
  #   options:
  #     spec: registries.yaml
  #     # Вид записи реестра → вид записи графа. Умолчания покрывают обычный
  #     # словарь; здесь дописывают только то, чего в нём нет.
  #     kinds:
  #       наш_вид: "entry_point:service"
  #
  # - id: сервисы-питона
  #   adapter: python_code         # реестр, записанный кодом; разбирается статически
  #   options:
  #     path: services/registry.py
  #     variable: SERVICES         # необязательно: сузить до одной таблицы
  #     call: register             # необязательно: форма вызова регистрации
  #     entry_kind: service

# Индекс связей (G01): разбор тел и вызовов берётся у стороннего разборщика,
# всё остальное — наше. Секция необязательна: репозиторий, для которого граф
# не собирают, её не заводит.
graph:
  # Путь к бинарю разборщика. УМОЛЧАНИЯ НЕТ НАМЕРЕННО: «поищем в PATH» —
  # это запуск того, что нашлось, а версия определяет и числа, и качество
  # разрешения вызовов. Пусто — отказ с указанием, что заполнить.
  engine_path: ""

  # Ожидаемая чек-сумма бинаря. Пусто — берётся закреплённая в коде (версия,
  # прошедшая в контур). Ключ существует, чтобы сменить версию осознанно,
  # а не чтобы её не проверять.
  engine_sha256: ""

  # `fast` / `moderate` / `full`. Измерено: режимы различаются только
  # семантическими рёбрами, рёбра вызова во всех трёх одинаковы, поэтому
  # `fast` — не компромисс, а режим без лишнего.
  mode: fast

  # Цели записи: от текущего каталога, как `out` и `worklist`. Индекс и кэш
  # разбора — артефакты прогона, а не часть репозитория. Кэш отдельный на
  # проект: два репозитория не должны его делить, иначе прогон по чужому кэшу
  # и прогон с нуля — два разных входа, которые выглядят одним.
  out: artifacts/graph.db
  cache_dir: .docpipe/engine-cache

# Интерфейсы, объявляющие диспетчеризацию по типу запроса: `IRequestHandler`
# у MediatR, его аналоги в других библиотеках и в самодельных шинах. Читает
# ключ шаг 1: объявление лежит в базовом типе с аргументом дженерика, и взять
# его можно только там, где разбираются объявления.
#
# Пусто по умолчанию намеренно: механика общая, а имена интерфейсов у каждого
# репозитория свои, и угадывать их значит завести правило, которое где-то
# сработает не на том.
dispatch_interfaces: []
  # - IRequestHandler
  # - INotificationHandler
