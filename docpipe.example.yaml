# Пример конфигурации docpipe. Скопируйте в свой репозиторий и правьте под него.
#
#     uv run docpipe scan --root . --config docpipe.yaml --out artifacts/doc-tree.json
#
# Файл называется `.example.`, потому что автоматически он не подхватывается:
# путь всегда задаётся флагом `--config`. Конфигурация без этого флага молча
# не применялась бы, а это худший вид ошибки — тот, который выглядит как успех.
#
# Пошаговая инструкция по настройке — в README.md, раздел «Настройка под конкретный
# проект». Для АС CF есть отдельный чек-лист: CASHFLOW.md.

# Корни обхода. Пока используется только первый; несколько понадобятся,
# когда в одном репозитории лежат независимые решения.
roots:
  - "."

# Какие проекты попадают в документацию. Глоб сравнивается с путём `.csproj`.
#
# Список только положительный: отрицаний нет, нужные каталоги перечисляются явно.
# Тестовые проекты сюда включать не нужно — но они всё равно разбираются,
# потому что их символы нужны графу наследования. Это разные вещи:
#   enrolled — «что документируем»;
#   exclude в rules/dotnet.yaml — «что не документируем, но читаем».
enrolled:
  - "src/**"
  # - "modules/*/src/**"

# Смысловая группировка модулей. Проверяется первый совпавший глоб
# в лексикографическом порядке ключей, а не в порядке записи в файле:
# перестановка строк не должна менять манифест.
#
# Без совпадения доменом становится имя модуля.
domains:
  # "src/Cf.Pricing.*/**": "pricing"
  # "src/Cf.Risk.*/**": "risk"
  # "src/Cf.Common.*/**": "platform"

# Набор правил классификации. Отделён от этого файла намеренно: правила
# описывают, *что считать контроллером*, и переносятся между проектами,
# а конфигурация — *где искать код*, и своя у каждого.
rules: "rules/dotnet.yaml"

# Куда писать манифест по умолчанию (флаг `--out` важнее).
out: "artifacts/doc-tree.json"

# Кэш разобранных файлов, путь относительно `--root`. Каталог стоит добавить
# в `.gitignore` сканируемого репозитория. Если писать в чужое дерево нельзя —
# `--no-cache` или путь наружу.
cache_dir: ".docpipe/cache"
